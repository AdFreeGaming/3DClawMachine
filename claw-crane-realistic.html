<style>
/* Layout: full-bleed 3D club room; stats float top corners, the control deck (stick + drop button) rides the bottom edge.
   Styled like the room: dark leather panels, brass rules and serif lettering. */
:root {
  --night: #0b0705;
  --panel: rgba(24, 15, 10, 0.86);
  --line: rgba(217, 182, 90, 0.32);
  --ink: #f1e5cc;
  --muted: #b39a70;
  --brass: #d9b65a;
  --marquee: #d9b65a;
  --deck: #1c3a2b;
  --button: #8c1616;
  --button-deep: #3f0808;
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Libre Baskerville", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 0; right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap;
  pointer-events: none;
}
.card {
  background: linear-gradient(160deg, rgba(40, 26, 16, 0.9), var(--panel)); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 0 0 3px rgba(217, 182, 90, 0.08), 0 10px 28px rgba(0, 0, 0, 0.55);
  pointer-events: auto; min-width: 0;
}
.brand { font: 700 21px/1 var(--display); color: var(--brass); letter-spacing: 0.06em; text-transform: uppercase; text-shadow: 0 1px 0 rgba(0,0,0,0.6); }
.stats { display: flex; gap: 18px; margin-top: 8px; }
.stat { display: grid; gap: 1px; }
.stat b { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--brass); font-variant-numeric: tabular-nums; line-height: 1.05; }
.label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); font-weight: 700; }
.haul { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; max-width: 220px; }
.haul:empty { display: none; }
.haul i { width: 14px; height: 14px; border-radius: 50%; display: block; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25); }

.tools { display: grid; gap: 8px; width: 210px; }
.grip-row { display: flex; justify-content: space-between; align-items: baseline; }
.grip-row output { font-weight: 700; font-size: 14px; }
input[type=range] { width: 100%; accent-color: var(--brass); }
.btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.views { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.btn[aria-pressed="true"] { background: var(--deck); border-color: var(--brass); color: var(--brass); }
#sound[aria-pressed] { background: rgba(217, 182, 90, 0.08); border-color: var(--line); color: var(--ink); }
.btn {
  flex: 1; font: 700 11px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink); background: rgba(217, 182, 90, 0.08); border: 1px solid var(--line);
  border-radius: 4px; padding: 9px 6px; cursor: pointer;
}
.btn:hover { background: rgba(217, 182, 90, 0.2); border-color: var(--brass); }
.btn:focus-visible, .pad button:focus-visible, .drop:focus-visible { outline: 2px solid var(--marquee); outline-offset: 2px; }

.deck {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none;
}
.pad {
  display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px;
  pointer-events: auto; touch-action: none;
}
.pad button {
  border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--brass);
  font-size: 16px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.45);
}
.pad button.on { background: var(--deck); border-color: var(--brass); }
.pad .up { grid-area: 1 / 2; } .pad .left { grid-area: 2 / 1; } .pad .right { grid-area: 2 / 3; } .pad .down { grid-area: 3 / 2; }
.status { font-style: italic;
  flex: 1; min-width: 0; text-align: center; align-self: center; font-weight: 400; font-size: 14px;
  color: var(--muted); text-wrap: balance;
}
.status strong { color: var(--ink); }
.drop {
  pointer-events: auto; width: 104px; height: 104px; border-radius: 50%; cursor: pointer;
  font: 700 17px/1 var(--display); color: var(--ink); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  background: radial-gradient(circle at 35% 30%, #c43c3c, var(--button) 45%, var(--button-deep));
  border: 5px solid #b8923a; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), 0 6px 0 #6b5220, 0 10px 24px rgba(0,0,0,0.55);
  transition: transform 0.08s, box-shadow 0.08s;
}
.drop:not([aria-disabled="true"]):active, .drop.pressed { transform: translateY(5px); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), 0 1px 0 #6b5220, 0 4px 12px rgba(0,0,0,0.45); }
.drop[aria-disabled="true"] { filter: grayscale(0.7) brightness(0.7); cursor: not-allowed; }

.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 96px); transform: translate(-50%, -8px);
  font: 700 22px/1.1 var(--display); color: var(--brass); text-align: center; padding: 12px 22px; letter-spacing: 0.04em;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; opacity: 0; pointer-events: none;
  box-shadow: inset 0 0 0 3px rgba(217, 182, 90, 0.08), 0 10px 28px rgba(0, 0, 0, 0.55);
  transition: opacity 0.25s, transform 0.25s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast small { display: block; font: 400 13px/1.4 var(--body); color: var(--ink); margin-top: 4px; letter-spacing: 0.02em; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; font: italic 600 20px var(--display); color: var(--muted); }
.keys { font-size: 12px; color: var(--muted); }
kbd { font: 700 10px var(--body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink); }

@media (max-width: 560px) {
  .tools { width: 190px; }
  .btn { font-size: 11px; letter-spacing: 0.02em; }
  .pad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
  .drop { width: 88px; height: 88px; font-size: 15px; }
  .status { font-size: 13px; }
  .keys { display: none; }
  .toast { top: calc(env(safe-area-inset-top, 0px) + 150px); }
}
@media (prefers-reduced-motion: reduce) { .toast, .drop { transition: none; } }
</style>

<div class="hud">
  <div class="card">

<div class="toast" id="toast"></div>

<div class="deck">

  <button class="drop" id="drop" type="button">Drop</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import RAPIER from './lib/rapier/rapier.es.js';

// Dimensions follow the SolidCraft model (mm → m). SolidCraft is Z-up with the front at -Y;
// here Y is up and the front faces +Z.
const FLOOR_Y = 0.9;          // play floor = top of the cabinet
const TOP_Y = 1.36;           // claw hub height when parked
const LIMIT = 0.3;            // claw travel, ± from centre: the hub reaches the inside of the glass (0.338)
const LIMIT_BACK = 0.28;      // a touch less at the back, where the open prongs splay toward the glass
const HOME = { x: 0.22, z: 0.22 }; // above the prize chute
const CHUTE = { x0: 0.16, x1: 0.32, z0: 0.16, z1: 0.32 };
const L = 0.13, R0 = 0.03, PY = -0.03;  // prong length, pivot radius, pivot drop
const OPEN = 0.62, CLOSED = -0.35;
const MIN_HUB_Y = FLOOR_Y + 0.15;
const MOVE_SPEED = 0.22, DROP_SPEED = 0.28, LIFT_SPEED = 0.2;
const DT = 1 / 120;
const CLAW_GROUPS = (0x0002 << 16) | 0xfffd; // claw parts ignore each other

const PRIZES = [
  ['Bubblegum', '#ff4f9a'], ['Sky', '#4fc3ff'], ['Butter', '#ffd54f'], ['Lime', '#7cff6b'],
  ['Lilac', '#b388ff'], ['Tangerine', '#ff8a3d'], ['Mint', '#4fffd2'], ['Cherry', '#ff5252'],
  ['Lemon', '#fff176'], ['Denim', '#64b5f6'], ['Rose', '#f06292'], ['Pistachio', '#aed581'],
  ['Coral', '#ff7f6e'], ['Grape', '#9575cd'], ['Aqua', '#26c6da'], ['Peach', '#ffab91'],
];
const KINDS = [['ball', 'ball'], ['bean', 'bean'], ['cube', 'cube']];

const $ = (id) => document.getElementById(id);
const stage = $('stage');

try {
  await RAPIER.init();
} catch (e) {
  $('loading').textContent = 'The physics engine could not load. Check your connection and reload.';
  throw e;
}
$('loading').hidden = true;

// ---------- renderer & scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0705');
scene.fog = new THREE.Fog('#0b0705', 7, 16);
// reflections come from a small warm "room" of lamps rather than the stock neutral studio, so brass and glass pick up candlelight
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(12, 12, 12), new THREE.MeshBasicMaterial({ color: '#2a1a10', side: THREE.BackSide })));
  const lamp = (x, y, z, color, k, sx, sy) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sy), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  };
  lamp(0, 5.5, 1, '#ffd9a0', 6, 2, 2); lamp(-5, 1.5, 0, '#ffa060', 2.5, 1, 2); lamp(5, 1, 1, '#ffe0b0', 2, 0.8, 1.6);
  lamp(0, 0, -5.5, '#ff9a40', 3, 2.5, 1.2); lamp(0, 2, 5.5, '#ffe8c8', 1.2, 2, 1);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
}
scene.environmentIntensity = 0.65;

const yUp = new THREE.Vector3(0, 1, 0);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 30);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.22, 0.5, 0.95); // only the flames, the fire and highlights spill
composer.addPass(bloom);
composer.addPass(new OutputPass());
composer.addPass(new SMAAPass(1, 1));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
// Named views: 'home' is the opening three-quarter view; null once the player orbits by hand.
const VIEW_TARGET = new THREE.Vector3(0, 1.2, 0);
const VIEW_DIRS = { home: [0.42, 0.42, 1], front: [0, 0.22, 1], left: [-1, 0.22, 0], right: [1, 0.22, 0] };
let viewName = 'home', camTween = null, clawCam = false;
controls.addEventListener('start', () => { viewName = null; camTween = null; showViewState(); });
controls.enableDamping = true;
controls.minDistance = 1.0;
controls.maxDistance = 4.6;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI * 0.53;
controls.enablePan = false;

function viewPose(name) {
  const aspect = stage.clientWidth / Math.max(stage.clientHeight, 1);
  const dist = Math.min(4.6, 3.1 * Math.max(1, 1.25 / aspect)); // room for the trophy shelf and a glimpse of the club
  const dir = new THREE.Vector3(...VIEW_DIRS[name]).normalize();
  return VIEW_TARGET.clone().addScaledVector(dir, dist);
}
function frameView() {
  camera.position.copy(viewPose(viewName || 'home'));
  controls.target.copy(VIEW_TARGET);
  controls.update();
}
function showViewState() {
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(!clawCam && b.dataset.view === viewName));
}
// glide the camera to a named view (instant when the viewer prefers reduced motion)
function setView(name) {
  leaveClawCam();
  viewName = name;
  camTween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: viewPose(name), start: performance.now() / 1000, dur: 0.7 };
  showViewState();
}
function enterClawCam() {
  clawCam = true; camTween = null;
  controls.enabled = false;
  camera.fov = 62; camera.near = 0.004; camera.updateProjectionMatrix();
  hubMesh.visible = false;
  showViewState();
  toast('Claw cam', 'You are riding the claw. Press C to climb out.');
}
function leaveClawCam() {
  if (!clawCam) return false;
  clawCam = false;
  controls.enabled = true;
  camera.fov = 38; camera.near = 0.05; camera.updateProjectionMatrix();
  hubMesh.visible = true;
  return true;
}
function toggleClawCam() {
  if (clawCam) setView(viewName || 'front'); else enterClawCam();
}
function updateCamera(now) {
  if (clawCam) {
    // ride just under the hub, looking down at the prizes; screen-up is the back of the machine,
    // so the steering keys match what you see
    const h = hubBody.translation();
    camera.position.set(h.x, h.y - 0.01, h.z);
    camera.lookAt(h.x, h.y - 1, h.z - 0.08);
    return;
  }
  if (camTween) {
    const k = reduceMotion.matches ? 1 : Math.min(1, (now - camTween.start) / camTween.dur);
    const e = easeInOut(k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, VIEW_TARGET, e);
    camera.lookAt(controls.target);
    if (k >= 1) camTween = null;
    else return;
  }
  controls.update();
  if (camera.position.y > ROOM.h - 0.2) { camera.position.y = ROOM.h - 0.2; camera.lookAt(controls.target); } // stay under the ceiling
}

// ---------- lighting: a dim club room lit by a chandelier, picture lights and a fire ----------
scene.add(new THREE.HemisphereLight('#7a5633', '#140b06', 0.75));
const key = new THREE.DirectionalLight('#ffd3a0', 0.75);     // the chandelier's share of the shadows
key.position.set(0.3, 3.0, 1.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.6, right: 2.6, top: 2.6, bottom: -2.6, near: 0.5, far: 9 });
key.shadow.bias = -0.0004;
scene.add(key);
const chandelierLight = new THREE.PointLight('#ffb870', 7, 9, 2);
chandelierLight.position.set(0, 2.55, 0.25);
scene.add(chandelierLight);
const canopyLight = new THREE.SpotLight('#ffe0b0', 1.4, 1.6, 1.0, 0.6, 1.2);
canopyLight.position.set(0, 1.54, 0);
canopyLight.target.position.set(0, FLOOR_Y, 0);
scene.add(canopyLight, canopyLight.target);
const fireLight = new THREE.PointLight('#ff7a2a', 3.5, 5, 2);
scene.add(fireLight);
function spot(color, intensity, [x, y, z], [tx, ty, tz], angle = 0.6, distance = 2) {
  const s = new THREE.SpotLight(color, intensity, distance, angle, 0.55, 1.5);
  s.position.set(x, y, z); s.target.position.set(tx, ty, tz);
  scene.add(s, s.target);
  return s;
}

// ---------- procedural surfaces: every texture is painted on a canvas, so the page needs no image files ----------
let seed = 7;
const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; // same grain every load
function canvasTex(w, h, paint, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.anisotropy = 8;
  return t;
}
// wood: long wavy grain lines, optionally cut into staggered planks
function paintWood(g, w, h, base, dark, light, { streaks = 160, vertical = false, planks = 0 } = {}) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const len = vertical ? h : w, span = vertical ? w : h;
  for (let i = 0; i < streaks; i++) {
    const y = rnd() * span, amp = 2 + rnd() * 6, f = 0.004 + rnd() * 0.01, ph = rnd() * 9;
    g.strokeStyle = rnd() < 0.7 ? dark : light; g.globalAlpha = 0.05 + rnd() * 0.22; g.lineWidth = 0.5 + rnd() * 2.5;
    g.beginPath();
    for (let x = 0; x <= len; x += 6) {
      const yy = y + Math.sin(x * f + ph) * amp + Math.sin(x * f * 3.1 + ph) * amp * 0.3;
      g.lineTo(vertical ? yy : x, vertical ? x : yy);
    }
    g.stroke();
  }
  g.globalAlpha = 1;
  if (planks) {
    const rowH = h / planks;
    for (let r = 0; r < planks; r++) {
      g.fillStyle = `rgba(0,0,0,${0.05 + rnd() * 0.12})`; g.fillRect(0, r * rowH, w, rowH); // each board a little different
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, r * rowH, w, 3);
      for (let k = 0; k < 3; k++) g.fillRect(((r * 0.37 + k / 3) % 1) * w, r * rowH, 3, rowH);
    }
  }
}
// leather: fine speckled grain over a base colour, with a few soft creases
function paintLeather(g, w, h, base, n = 5000) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() < 0.5 ? '#000' : '#fff'; g.globalAlpha = 0.03 + rnd() * 0.07;
    g.beginPath(); g.arc(rnd() * w, rnd() * h, 0.6 + rnd() * 1.8, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}
// panelled wall: vertical mahogany grain with raised wainscot and tall upper panels, skirting, dado rail and frieze
function paintPanelWall(g, w, h, wallW, wallH, cols) {
  paintWood(g, w, h, '#3b1b10', '#1f0f08', '#6e3c20', { streaks: 260, vertical: true });
  const px = w / wallW, py = h / wallH, Y = (m) => h - m * py;
  const panel = (x0, y0, x1, y1) => {
    g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x0, Y(y1), x1 - x0, (y1 - y0) * py);
    g.lineWidth = 3; g.strokeStyle = 'rgba(255,220,170,0.3)'; g.beginPath(); g.moveTo(x0, Y(y0)); g.lineTo(x0, Y(y1)); g.lineTo(x1, Y(y1)); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.65)'; g.beginPath(); g.moveTo(x1, Y(y1)); g.lineTo(x1, Y(y0)); g.lineTo(x0, Y(y0)); g.stroke();
    const i = 0.06 * px;

// oriental rug: nested borders, a lattice field, a central medallion and corner spandrels, worn with speckle
function paintRug(g, w, h) {
  const red = '#7b1d1f', navy = '#1c2745', cream = '#e2cfa6', gold = '#b98a3c';
  g.fillStyle = red; g.fillRect(0, 0, w, h);
  const band = (inset, width, color) => { g.lineWidth = width; g.strokeStyle = color; g.strokeRect(inset, inset, w - 2 * inset, h - 2 * inset); };
  band(30, 44, navy); band(64, 5, cream); band(96, 40, cream); band(126, 5, navy); band(156, 26, gold); band(182, 4, cream);
  const diamond = (x, y, r) => { g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.fill(); };
  g.fillStyle = navy;
  for (let x = 118; x < w - 100; x += 46) { diamond(x, 116, 11); diamond(x, h - 116, 11); }
  for (let y = 118; y < h - 100; y += 46) { diamond(116, y, 11); diamond(w - 116, y, 11); }
  g.fillStyle = 'rgba(28,39,69,0.85)';
  for (let y = 270; y < h - 270; y += 68) for (let x = 250 + ((y / 68) % 2) * 34; x < w - 250; x += 68) diamond(x, y, 8);
  const cx = w / 2, cy = h / 2;
  g.fillStyle = navy; diamond(cx, cy, 330); g.fillStyle = cream; diamond(cx, cy, 300); g.fillStyle = navy; diamond(cx, cy, 285);
  g.fillStyle = red; diamond(cx, cy, 200); g.fillStyle = gold; diamond(cx, cy, 150);
  g.fillStyle = navy; g.beginPath(); g.arc(cx, cy, 110, 0, 7); g.fill();
  g.fillStyle = cream; g.beginPath(); g.arc(cx, cy, 92, 0, 7); g.fill();
  g.fillStyle = red; g.beginPath(); g.arc(cx, cy, 70, 0, 7); g.fill();
  g.fillStyle = gold; diamond(cx, cy, 34);
  for (let k = 0; k < 8; k++) { g.fillStyle = cream; g.beginPath(); g.arc(cx + Math.cos(k * Math.PI / 4) * 200, cy + Math.sin(k * Math.PI / 4) * 200, 16, 0, 7); g.fill(); }
  g.fillStyle = navy;
  for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
    g.beginPath(); g.moveTo(cx - sx * (cx - 196), cy - sy * (cy - 196)); g.lineTo(cx - sx * (cx - 196) + sx * 220, cy - sy * (cy - 196)); g.lineTo(cx - sx * (cx - 196), cy - sy * (cy - 196) + sy * 220); g.closePath(); g.fill();
  }
  for (let i = 0; i < 36000; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.14)' : 'rgba(255,230,190,0.09)'; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
  g.strokeStyle = cream; g.lineWidth = 2;                                                        // fringe
  for (let x = 6; x < w; x += 7) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 26); g.moveTo(x, h); g.lineTo(x, h - 26); g.stroke(); }
}
// oil paintings: a landscape, a portrait and a seascape, finished with brush noise and a dark varnished vignette
function brushAndVarnish(g, w, h) {
  for (let i = 0; i < 1400; i++) {
    g.strokeStyle = rnd() < 0.5 ? 'rgba(255,240,200,0.06)' : 'rgba(0,0,0,0.09)'; g.lineWidth = 1 + rnd() * 3;
    const x = rnd() * w, y = rnd() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 40, y + (rnd() - 0.5) * 12); g.stroke();
  }
  const v = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(25,12,0,0.78)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
}
function paintLandscape(g, w, h) {
  const sky = g.createLinearGradient(0, 0, 0, h * 0.7);
  sky.addColorStop(0, '#2a2838'); sky.addColorStop(0.55, '#b86a34'); sky.addColorStop(1, '#e9b56a');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  for (const [c, base, amp] of [['#4a4f3a', 0.55, 0.08], ['#33402a', 0.63, 0.06], ['#1f2a1a', 0.72, 0.04]]) {
    g.fillStyle = c; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 8) g.lineTo(x, h * (base + Math.sin(x / w * 7 + base * 9) * amp + Math.sin(x / w * 19) * amp * 0.3));
    g.lineTo(w, h); g.fill();
  }
  const water = g.createLinearGradient(0, h * 0.78, 0, h); water.addColorStop(0, '#9a7a4a'); water.addColorStop(1, '#2a2416');
  g.fillStyle = water; g.fillRect(0, h * 0.78, w, h * 0.22);
  g.fillStyle = '#15190f'; g.fillRect(w * 0.16, h * 0.42, w * 0.016, h * 0.4);                 // a tree
  for (let k = 0; k < 7; k++) { g.beginPath(); g.arc(w * 0.168 + (rnd() - 0.5) * w * 0.12, h * (0.3 + rnd() * 0.18), w * 0.04 + rnd() * w * 0.03, 0, 7); g.fill(); }
  brushAndVarnish(g, w, h);
}
function paintPortrait(g, w, h) {
  const bg = g.createRadialGradient(w * 0.5, h * 0.35, 20, w * 0.5, h * 0.5, h * 0.8);
  bg.addColorStop(0, '#5a3a24'); bg.addColorStop(1, '#120a05'); g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = '#17110c'; g.beginPath(); g.ellipse(w * 0.5, h * 1.0, w * 0.46, h * 0.5, 0, 0, 7); g.fill();     // coat
  g.fillStyle = '#e8e2d2'; g.beginPath(); g.moveTo(w * 0.42, h * 0.5); g.lineTo(w * 0.58, h * 0.5); g.lineTo(w * 0.5, h * 0.72); g.fill(); // cravat
  g.fillStyle = '#d6a77e'; g.beginPath(); g.ellipse(w * 0.5, h * 0.36, w * 0.14, h * 0.13, 0, 0, 7); g.fill();  // face
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(w * 0.55, h * 0.38, w * 0.1, h * 0.12, 0, 0, 7); g.fill();
  g.fillStyle = '#1a120c'; g.beginPath(); g.ellipse(w * 0.5, h * 0.26, w * 0.15, h * 0.06, 0, Math.PI, 7); g.fill(); // hair
  g.fillStyle = '#2a1a10'; g.fillRect(w * 0.44, h * 0.345, w * 0.035, h * 0.012); g.fillRect(w * 0.53, h * 0.345, w * 0.035, h * 0.012);
  brushAndVarnish(g, w, h);
}
function paintSeascape(g, w, h) {
  const sky = g.createLinearGradient(0, 0, 0, h * 0.6); sky.addColorStop(0, '#3a4a5c'); sky.addColorStop(1, '#c9b89a');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  const sea = g.createLinearGradient(0, h * 0.6, 0, h); sea.addColorStop(0, '#4a6270'); sea.addColorStop(1, '#17232b');
  g.fillStyle = sea; g.fillRect(0, h * 0.6, w, h * 0.4);
  g.strokeStyle = 'rgba(255,255,255,0.12)'; for (let y = h * 0.62; y < h; y += 9) { g.beginPath(); g.moveTo(rnd() * w * 0.3, y); g.lineTo(w - rnd() * w * 0.3, y); g.stroke(); }
  g.fillStyle = '#121418';                                                                       // a ship
  g.beginPath(); g.moveTo(w * 0.3, h * 0.6); g.lineTo(w * 0.7, h * 0.6); g.lineTo(w * 0.66, h * 0.66); g.lineTo(w * 0.34, h * 0.66); g.fill();
  for (const x of [0.4, 0.52, 0.62]) { g.fillRect(w * x, h * 0.28, w * 0.01, h * 0.32); g.beginPath(); g.moveTo(w * x, h * 0.3); g.lineTo(w * (x + 0.07), h * 0.52); g.lineTo(w * x, h * 0.52); g.fill(); }
  brushAndVarnish(g, w, h);
}

const prongs = [];
for (let i = 0; i < 3; i++) {
  const phi = i * (Math.PI * 2 / 3) + Math.PI / 6;
  const radial = new THREE.Vector3(Math.cos(phi), 0, -Math.sin(phi));
  const tangent = new THREE.Vector3(Math.sin(phi), 0, Math.cos(phi));
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), phi);
  const pivot = radial.clone().multiplyScalar(R0).add(new THREE.Vector3(0, PY, 0));
  const armC = pivot.clone().add(new THREE.Vector3(0, -L / 2, 0));
  const hookC = pivot.clone().add(new THREE.Vector3(0, -L, 0)).addScaledVector(radial, -0.014);
  const rq = { x: q.x, y: q.y, z: q.z, w: q.w };

  const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(hub.x, hub.y, hub.z).setCanSleep(false).setAngularDamping(1));
  const part = (desc, c) => world.createCollider(desc.setTranslation(c.x, c.y, c.z).setRotation(rq).setDensity(2000).setFriction(1.3).setCollisionGroups(CLAW_GROUPS), body);
  const colliders = [part(RAPIER.ColliderDesc.cuboid(0.005, L / 2, 0.012), armC), part(RAPIER.ColliderDesc.cuboid(0.016, 0.005, 0.012), hookC)];

  const joint = world.createImpulseJoint(RAPIER.JointData.revolute(pivot, pivot, tangent), hubBody, body, true);
  joint.setContactsEnabled(false);
  joint.setLimits(-0.45, 0.75);
  joint.configureMotorModel(RAPIER.MotorModel.ForceBased);

  const g = new THREE.Group();
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.01, L, 0.024), M.gold); arm.position.copy(armC); arm.quaternion.copy(q);
  const hook = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.01, 0.024), M.gold); hook.position.copy(hookC); hook.quaternion.copy(q);
  const knuckle = new THREE.Mesh(new THREE.SphereGeometry(0.009, 16, 12), M.gold); knuckle.position.copy(pivot);
  for (const m of [arm, hook, knuckle]) { m.castShadow = true; g.add(m); }
  scene.add(g);
  prongs.push({ body, joint, colliders, mesh: g });
}

function setClaw(angle, stiffness) {
  for (const p of prongs) p.joint.configureMotorPosition(angle, stiffness, 0.02);
}

const WHITE = plush('#ffffff'), INK = mat('#151515', { roughness: 0.25 }), PINK = plush('#ff8fab');
function part(parent, geo, material, [x, y, z], [sx, sy, sz], [rx, ry, rz] = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.set(rx, ry, rz);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function pivot(parent, x, y, z) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
function cuteEye(parent, [x, y, z], r, [dx, dy, dz] = [0, 0, 1]) {
  part(parent, SPH, WHITE, [x, y, z], [r, r, r]);
  part(parent, SPH, INK, [x + dx * r * 0.5, y + dy * r * 0.5, z + dz * r * 0.5], [r * 0.62, r * 0.62, r * 0.62]);
  const hl = r * 0.16;
  part(parent, SPH, WHITE, [x + dx * r * 0.95 + r * 0.2 * Math.abs(dz), y + dy * r * 0.95 + r * 0.25, z + dz * r * 0.95 + r * 0.2 * Math.abs(dx)], [hl, hl, hl]);
}
const quat = (ax, ay, az, angle) => { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(ax, ay, az), angle); return { x: q.x, y: q.y, z: q.z, w: q.w }; };

// prizes
let prizes = [];
const eyeGeo = new THREE.SphereGeometry(0.0055, 12, 8);
function addEyes(mesh, front) {
  for (const sx of [-1, 1]) { const e = new THREE.Mesh(eyeGeo, M.eye); e.position.set(sx * 0.013, 0.01, front); mesh.add(e); }
}
function spawnPrize(i, x, y, z, character) {
  let name, color, kind, mesh, shapes, half, parts = null, density = 192;
  if (character) {
    const c = CHARACTERS[character];
    ({ mesh, shapes, half, parts } = c.build());
    name = c.name; color = c.color; kind = character;
  } else {
    let label;
    [label, color] = PRIZES[i % PRIZES.length];
    kind = KINDS[i % 3][0];
    name = `${label} ${kind}`;
    let geo, desc, front;
    if (kind === 'ball') {
      const r = 0.042 + Math.random() * 0.008;
      geo = new THREE.SphereGeometry(r, 32, 20); desc = RAPIER.ColliderDesc.ball(r); front = r * 0.96; half = r;
    } else if (kind === 'bean') {
      geo = new THREE.CapsuleGeometry(0.033, 0.05, 8, 20); desc = RAPIER.ColliderDesc.capsule(0.025, 0.033); front = 0.032; half = 0.058;
    } else {
      const s = 0.07, rr = 0.018; half = s / 2;
      geo = new RoundedBoxGeometry(s, s, s, 4, rr); desc = RAPIER.ColliderDesc.roundCuboid(s / 2 - rr, s / 2 - rr, s / 2 - rr, rr); front = s / 2;
      density *= (s / (s - 2 * rr)) ** 3; // Rapier weighs only the inner cuboid of a round cuboid
    }
    mesh = new THREE.Mesh(geo, plush(color)); mesh.castShadow = true; mesh.receiveShadow = true;
    addEyes(mesh, front);
    shapes = [{ desc }];
  }
  mesh.userData.parts = parts;
  scene.add(mesh);
  // stuffed fabric: 20% heavier than before, no bounce, grippy, and quick to stop rolling or spinning
  // character toys start roughly upright so they land face-up in the pile; plain prizes tumble in any way
  const rot = new THREE.Quaternion().setFromEuler(character
    ? new THREE.Euler((Math.random() - 0.5) * 0.4, Math.random() * 6.28, (Math.random() - 0.5) * 0.4)
    : new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6));
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z)
    .setRotation({ x: rot.x, y: rot.y, z: rot.z, w: rot.w }).setLinearDamping(0.5).setAngularDamping(2.2).setCcdEnabled(true));
  for (const s of shapes) {
    if (s.t) s.desc.setTranslation(...s.t);
    if (s.q) s.desc.setRotation(s.q);
    world.createCollider(s.desc.setDensity(density).setFriction(1.1)
      .setRestitution(0).setRestitutionCombineRule(RAPIER.CoefficientCombineRule.Min), body);
  }
  prizes.push({ name, color, body, mesh, kind, half });
}
function restock() {
  for (const p of prizes) { world.removeRigidBody(p.body); scene.remove(p.mesh); }
  prizes = [];
  const spotsFor = (n) => {
    const spots = [];
    for (let tries = 0; spots.length < n && tries < 4000; tries++) {
      const x = -0.27 + Math.random() * 0.54, z = -0.27 + Math.random() * 0.54;
      if (x > CHUTE.x0 - 0.07 && z > CHUTE.z0 - 0.07) continue;
      if (spots.some((s) => Math.hypot(s.x - x, s.z - z) < 0.1)) continue;
      spots.push({ x, z });
    }
    return spots;
  };
  // two of every character toy plus 8 plain prizes, dropped in two layers: the plain prizes and some
  // toys first, then the rest of the toys on top once the first layer has settled
  const toys = Object.keys(CHARACTERS).flatMap((k) => [k, k]).sort(() => Math.random() - 0.5);
  const queue = [...Array(8)].map((_, i) => ({ i })).concat(toys.map((c, i) => ({ i, c })));
  for (const [layer, y] of [[queue.splice(0, 16), FLOOR_Y + 0.07], [queue, FLOOR_Y + 0.21]]) {
    spotsFor(layer.length).forEach((s, k) => spawnPrize(layer[k].i, s.x, y + Math.random() * 0.03, s.z, layer[k].c));
    for (let k = 0; k < 160; k++) world.step(); // settle before the next layer / before showing
  }
}

// ---------- sound (all synthesised with Web Audio) ----------
const Sound = (() => {
  let ctx = null, master, motorGain, osc1, osc2, filter, noiseBuf;
  let muted = false;
  try { muted = localStorage.getItem('claw-crane-muted') === '1'; } catch {}
  const VOL = 0.6;
  function unlock() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : VOL; master.connect(ctx.destination);
    // motor: detuned saw + square through a resonant low-pass, with a fast tremolo for gear rattle
    filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 700; filter.Q.value = 4;
    osc1 = ctx.createOscillator(); osc1.type = 'sawtooth'; osc1.frequency.value = 85;
    osc2 = ctx.createOscillator(); osc2.type = 'square'; osc2.frequency.value = 128;
    const o2 = ctx.createGain(); o2.gain.value = 0.35;
    const trem = ctx.createGain(); trem.gain.value = 0.7;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 28;
    const lfoDepth = ctx.createGain(); lfoDepth.gain.value = 0.3;
    motorGain = ctx.createGain(); motorGain.gain.value = 0;
    osc1.connect(filter); osc2.connect(o2); o2.connect(filter);
    lfo.connect(lfoDepth); lfoDepth.connect(trem.gain);
    filter.connect(trem); trem.connect(motorGain); motorGain.connect(master);
    osc1.start(); osc2.start(); lfo.start();
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ready = () => ctx && ctx.state === 'running';
  function tone(type, f0, f1, start, dur, vol) {
    const t = ctx.currentTime + start, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function noise(start, dur, vol, freq) {
    const t = ctx.currentTime + start, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  // claw servo: a buzzy whir that sweeps in pitch as the prongs swing, with a gear-tooth flutter
  function servo(dur, closing) {
    const t = ctx.currentTime, o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    const flutter = ctx.createOscillator(), depth = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(closing ? 260 : 420, t);

// ---------- game state ----------
const S = { IDLE: 'idle', DROP: 'drop', CLOSE: 'close', LIFT: 'lift', CARRY: 'carry', RELEASE: 'release' };
let state = S.IDLE, timer = 0, credits = 5, wonCount = 0, wonThisRound = false, againstGlass = false;
const input = { up: false, down: false, left: false, right: false };

function setStatus(html) { $('status').innerHTML = html; }
function updateHud() {
  $('credits').textContent = credits;
  $('won').textContent = wonCount;
  $('drop').setAttribute('aria-disabled', String(state !== S.IDLE || credits <= 0)); // stays clickable so a no-credit press can buzz
  if (state === S.IDLE && credits <= 0) setStatus('Out of credits. Press <strong>Insert coin</strong> to keep playing.');
}
let toastTimer;
function toast(title, sub) {
  const t = $('toast');
  t.innerHTML = `${title}<small>${sub}</small>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function drop() {
  if (state === S.IDLE && credits <= 0) Sound.denied();
  if (state !== S.IDLE || credits <= 0) return;
  credits--; wonThisRound = false;
  carried.clear(); droppedThisRound = false;
  Sound.button();
  state = S.DROP; timer = 0;
  setClaw(OPEN, 0.5);
  pressedAt = performance.now() / 1000;
  $('drop').classList.add('pressed');
  setTimeout(() => $('drop').classList.remove('pressed'), 160);
  setStatus('Dropping…');
  updateHud();
}

// Steering is fixed to the machine, like a real cabinet: up = towards the back glass,
// right = towards the right side, wherever the camera is orbited.
function steer() {
  const v = new THREE.Vector3((input.right ? 1 : 0) - (input.left ? 1 : 0), 0, (input.down ? 1 : 0) - (input.up ? 1 : 0));
  if (v.lengthSq() > 1) v.normalize();
  return v;
}

function hubTouching() {
  let hit = false;
  world.contactPairsWith(hubCollider, (other) => {
    world.contactPair(hubCollider, other, (m) => { if (m.numContacts() > 0) hit = true; });
  });
  return hit;
}

function approach(cur, target, maxStep) {
  const d = target - cur;
  return Math.abs(d) <= maxStep ? target : cur + Math.sign(d) * maxStep;
}

function logic(dt, move) {
  switch (state) {
    case S.IDLE:
      if (credits <= 0) { if (move.lengthSq() > 0) Sound.denied(); break; } // the gantry is powered down until a coin goes in
      {
        const nx = hub.x + move.x * MOVE_SPEED * dt, nz = hub.z + move.z * MOVE_SPEED * dt;
        const pushing = nx > LIMIT || nx < -LIMIT || nz > LIMIT || nz < -LIMIT_BACK;
        if (pushing && !againstGlass) Sound.denied(); // bump: buzz once each time the claw reaches the glass
        againstGlass = pushing;
        hub.x = THREE.MathUtils.clamp(nx, -LIMIT, LIMIT);
        hub.z = THREE.MathUtils.clamp(nz, -LIMIT_BACK, LIMIT);
      }
      break;
    case S.DROP:
      hub.y -= DROP_SPEED * dt; timer += dt;
      if (hub.y <= MIN_HUB_Y || (timer > 0.3 && hubTouching())) {
        hub.y = Math.max(hub.y, MIN_HUB_Y);
        state = S.CLOSE; timer = 0;
        setClaw(CLOSED, gripStiffness());
        Sound.closeClaw();
        setStatus('Grabbing…');
      }
      break;
    case S.CLOSE:
      timer += dt;
      if (timer > 0.9) { state = S.LIFT; setStatus('Lifting…'); }
      break;
    case S.LIFT:
      hub.y = Math.min(TOP_Y, hub.y + LIFT_SPEED * dt);
      if (hub.y >= TOP_Y) { state = S.CARRY; setStatus('Heading for the chute…'); }
      break;
    case S.CARRY:
      hub.x = approach(hub.x, HOME.x, MOVE_SPEED * dt);
      hub.z = approach(hub.z, HOME.z, MOVE_SPEED * dt);
      if (hub.x === HOME.x && hub.z === HOME.z) { state = S.RELEASE; timer = 0; setClaw(OPEN, 0.5); Sound.openClaw(); setStatus('Releasing…'); }
      break;
    case S.RELEASE:
      timer += dt;
      if (timer > 1.6) {
        state = S.IDLE;
        setStatus(wonThisRound ? 'Nice catch! Steer to your next target.' : droppedThisRound ? 'It slipped out. Line up and try again.' : 'So close. Line up and try again.');
        updateHud();
      }
      break;
  }
}

// ---------- trophy shelf on top of the canopy ----------
// Each kind has a persona: balls bounce, beans wiggle, cubes turn and hop, and every
// character toy moves the way its animal would.
const trophies = [];
const PERSONA = { ball: 'bounces', bean: 'wiggles', cube: 'hops',
  ...Object.fromEntries(Object.entries(CHARACTERS).map(([k, c]) => [k, c.persona])) };
const SHELF_Y = 1.75, TROPHY_SCALE = 0.85;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const DOOR = new THREE.Vector3(0.24, 0.2, 0.3), LIP = new THREE.Vector3(0.24, 0.2, 0.46);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
function shelfSlot(i) {
  const row = Math.floor(i / 8) % 4, col = i % 8;
  return new THREE.Vector3(-0.315 + col * 0.09, SHELF_Y, 0.255 - row * 0.17);
}
function bezier(p0, p1, p2, t, out) {
  const u = 1 - t;
  return out.set(
    u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
    u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y,
    u * u * p0.z + 2 * u * t * p1.z + t * t * p2.z);
}
function characterPersona(kind, m, p, base, tau) {
  const sin = Math.sin;
  switch (kind) {
    case 'alligator': {                                // jaw creeps open, then snaps shut
      const c = (tau * 0.6) % 1;
      const open = c < 0.75 ? c / 0.75 : Math.max(0, 1 - (c - 0.75) / 0.05);
      p.jaw.rotation.x = open * 0.5;
      p.tail.rotation.y = sin(tau * 1.6) * 0.35;
      m.rotation.y = 0.75 + sin(tau * 0.5) * 0.2;      // three-quarter turn so its long snout shows
      break;
    }
    case 'mantis':                                     // arms bob in prayer, head tilts curiously
      for (const a of p.arms) a.rotation.x = sin(tau * 1.6) * 0.25;
      p.head.rotation.z = sin(tau * 0.8) * 0.3;
      m.rotation.z = sin(tau * 0.8 + 1) * 0.05;
      break;
    case 'kitten': {                                   // tail swish, head tilt, a crouch-and-pounce every few seconds
      p.tail.rotation.y = sin(tau * 2.2) * 0.45;
      p.head.rotation.z = sin(tau * 0.7) * 0.18;
      const c = tau % 4;
      if (c < 0.5) m.scale.y *= 1 - sin((c / 0.5) * Math.PI) * 0.12;
      else if (c < 0.9) { m.position.y = base + sin(((c - 0.5) / 0.4) * Math.PI) * 0.04; m.rotation.x = -sin(((c - 0.5) / 0.4) * Math.PI) * 0.25; }
      break;
    }
    case 'puppy': {                                    // happy tail wag, bouncy hops with flopping ears
      p.tail.rotation.z = sin(tau * 16) * 0.55;
      const hop = Math.abs(sin(tau * 2.6));
      m.position.y = base + hop * 0.014;
      for (const [i, e] of p.ears.entries()) e.rotation.z = (i ? 1 : -1) * (0.15 + (1 - hop) * 0.35);
      p.head.rotation.x = sin(tau * 2.6) * 0.08;
      break;
    }
    case 'clownfish':                                  // hovers and swims in place
      m.position.y = base + 0.025 + sin(tau * 1.8) * 0.01;
      m.rotation.y = sin(tau * 1.1) * 0.35;
      m.rotation.z = sin(tau * 1.8) * 0.06;
      p.tail.rotation.y = sin(tau * 11) * 0.5;
      break;
    case 'penguin':                                    // side-to-side waddle, flippers flapping
      m.rotation.z = sin(tau * 3) * 0.15;
      m.position.y = base + Math.abs(sin(tau * 3)) * 0.006;
      for (const [i, f] of p.flippers.entries()) f.rotation.z = (i ? 1 : -1) * (0.15 + Math.abs(sin(tau * 3)) * 0.45);
      break;
    case 'snake': {                                    // head sways, tongue flicks
      p.head.rotation.y = sin(tau * 1.2) * 0.4;
      p.head.rotation.z = sin(tau * 2.4) * 0.08;
      const c = (tau * 1.5) % 1;
      p.tongue.scale.z = c < 0.25 ? 0.4 + sin((c / 0.25) * Math.PI) * 0.9 : 0.4;
      m.rotation.y = sin(tau * 0.4) * 0.3;
      break;
    }
    case 'sparrow': {                                  // hops and flutters, head bobbing
      const c = tau % 2.2;
      const air = c < 0.6 ? sin((c / 0.6) * Math.PI) : 0;
      m.position.y = base + air * 0.045;
      for (const [i, w] of p.wings.entries()) w.rotation.z = (i ? 1 : -1) * (air > 0 ? 0.2 + Math.abs(sin(tau * 22)) * 0.9 : 0);
      p.head.rotation.x = sin(tau * 3.5) * 0.12;
      p.head.rotation.z = sin(tau * 0.9) * 0.15;
      break;
    }
    case 'duck':                                       // bobs and rocks as if afloat, nodding now and then
      m.position.y = base + sin(tau * 1.6) * 0.006;
      m.rotation.x = sin(tau * 1.6 + 0.8) * 0.12;
      m.rotation.z = sin(tau * 1.1) * 0.08;
      p.head.rotation.x = Math.max(0, sin(tau * 0.9)) ** 4 * 0.35;
      p.tail.rotation.y = sin(tau * 5) * 0.3;
      break;
    case 'mouse': {                                    // sniffs and twitches its ears, then a quick scurry
      const c = tau % 3;
      p.nose.scale.setScalar(1 + Math.max(0, sin(tau * 14)) * 0.35);
      p.head.rotation.x = sin(tau * 7) * 0.05;
      for (const [i, e] of p.ears.entries()) e.rotation.z = (i ? 1 : -1) * (c > 2.5 ? sin(((c - 2.5) / 0.5) * Math.PI * 2) * 0.3 : 0);
      if (c < 0.8) { m.rotation.y = sin((c / 0.8) * Math.PI * 2) * 0.6; m.position.y = base + Math.abs(sin(tau * 30)) * 0.004; }
      p.tail.rotation.y = sin(tau * 2) * 0.4;
      break;
    }
    case 'frog': {                                     // throat puffs as it croaks, then a big leap with legs kicked out
      const c = tau % 3.5;
      p.throat.scale.setScalar(c < 2 ? 1 + Math.max(0, sin(c * Math.PI * 2.5)) * 0.7 : 1);
      if (c > 2.4 && c < 3.1) {
        const k = sin(((c - 2.4) / 0.7) * Math.PI);
        m.position.y = base + k * 0.06;
        m.rotation.x = -k * 0.35;
        for (const l of p.legs) l.rotation.x = k * 0.9;
      } else for (const l of p.legs) l.rotation.x = 0;

    }
  }
}
function persona(tr, m, base, time) {
  const tau = time + tr.seed, S = TROPHY_SCALE;
  m.rotation.set(0, 0, 0);
  m.scale.setScalar(S);
  m.position.set(tr.slot.x, base, tr.slot.z);
  if (reduceMotion.matches) return;
  if (tr.kind === 'ball') {
    const s = Math.abs(Math.sin(tau * 3.2));
    const squash = Math.max(0, 0.25 - s) * 0.5;      // flatten for a moment at each landing
    m.scale.set(S * (1 + squash), S * (1 - squash), S * (1 + squash));
    m.position.y = base + s * 0.035 - tr.half * S * squash;
  } else if (tr.kind === 'bean') {
    m.rotation.z = Math.sin(tau * 2.2) * 0.22;
    m.rotation.y = Math.sin(tau * 1.1) * 0.15;
    m.position.y = base + Math.abs(Math.sin(tau * 2.2)) * 0.006;
  } else if (CHARACTERS[tr.kind]) {
    characterPersona(tr.kind, m, m.userData.parts, base, tau);
  } else {
    m.rotation.y = Math.sin(tau * 0.7) * 0.7;
    const h = tau % 3.2;
    m.position.y = base + (h < 0.45 ? Math.sin((h / 0.45) * Math.PI) * 0.03 : 0);
  }
}
function updateTrophies(time) {
  for (const tr of trophies) {
    const m = tr.mesh, S = TROPHY_SCALE, t = time - tr.t0;
    const base = tr.slot.y + tr.half * S;
    const floorSpot = tmpA.set(0.24, tr.half * S, 0.64);
    if (reduceMotion.matches || t > 2.9) { persona(tr, m, base, time); continue; }
    m.rotation.set(0, 0, 0);
    if (t < 0.5) {                                     // pushes the flap open
      const k = easeInOut(t / 0.5);
      m.position.lerpVectors(DOOR, LIP, k);
      m.scale.setScalar(S * (0.4 + 0.6 * k));
    } else if (t < 0.95) {                             // tumbles out onto the floor
      const k = (t - 0.5) / 0.45;
      m.position.lerpVectors(LIP, floorSpot, k);
      m.position.y += Math.sin(k * Math.PI) * 0.06;
      m.rotation.x = k * Math.PI * 0.5;
      m.scale.setScalar(S);
    } else if (t < 1.3) {                              // lands with a squish
      const k = (t - 0.95) / 0.35, sq = Math.sin(k * Math.PI) * 0.18;
      m.position.copy(floorSpot); m.position.y -= tr.half * S * sq;
      m.scale.set(S * (1 + sq), S * (1 - sq), S * (1 + sq));
    } else {                                           // floats up to its place on the shelf
      const k = easeInOut((t - 1.3) / 1.6);
      const ctrl = tmpB.set((floorSpot.x + tr.slot.x) / 2, 2.25, 0.55);
      bezier(floorSpot, ctrl, new THREE.Vector3(tr.slot.x, base, tr.slot.z), k, m.position);
      m.rotation.y = k * Math.PI * 2;
      m.scale.setScalar(S);
    }
  }
}

// A prize counts as dropped when the claw lifted it and it then falls well below the claw
// anywhere except into the chute.
const carried = new Set();
let droppedThisRound = false, lastWinSound = -10;
function checkDrops() {
  if (state === S.LIFT || state === S.CARRY) {
    for (const p of prizes) if (p.body.translation().y > FLOOR_Y + 0.15) carried.add(p);
  }
  for (const p of carried) {
    if (!prizes.includes(p)) { carried.delete(p); continue; }
    const t = p.body.translation();
    const nearChute = t.x > CHUTE.x0 - 0.05 && t.z > CHUTE.z0 - 0.05;
    if (!nearChute && hub.y > FLOOR_Y + 0.3 && t.y < hub.y - 0.28) {
      carried.delete(p);
      if (!droppedThisRound) {
        droppedThisRound = true;
        Sound.ohNo();
        toast('Oh no!', `The ${p.name} slipped out of the claw.`);
      }
    }
  }
}

function checkWins() {
  for (const p of [...prizes]) {
    const t = p.body.translation();
    if (t.y < FLOOR_Y - 0.12 && t.x > CHUTE.x0 - 0.02 && t.z > CHUTE.z0 - 0.02) {
      world.removeRigidBody(p.body);
      prizes = prizes.filter((o) => o !== p);
      trophies.push({ mesh: p.mesh, kind: p.kind, half: p.half, t0: performance.now() / 1000, slot: shelfSlot(trophies.length), seed: Math.random() * 10 });
      wonCount++; wonThisRound = true;
      const sw = document.createElement('i'); sw.style.background = p.color; sw.title = p.name;
      $('haul').appendChild(sw);
      toast('You won!', `The ${p.name} pops out of the flap and ${PERSONA[p.kind]} up to the top shelf.`);
      const nowS = performance.now() / 1000;
      if (nowS - lastWinSound > 1.5) { Sound.win(); lastWinSound = nowS; }
      flapSwing = 1;
      updateHud();
    } else if (t.y < -1 || Math.abs(t.x) > 2 || Math.abs(t.z) > 2) {
      p.body.setTranslation({ x: -0.1, y: FLOOR_Y + 0.2, z: -0.1 }, true);
      p.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
    }
  }
}

function resize() {

  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1);

}

let flapSwing = 0;
const prevHub = { ...hub };
const clock = new THREE.Clock();

function frame() {
  const frameDt = Math.min(clock.getDelta(), 0.05);
  acc = Math.min(acc + frameDt, 0.1);
  const now = performance.now() / 1000;
  const move = steer();
  while (acc >= DT) {
    logic(DT, move);
    hubBody.setNextKinematicTranslation(hub);
    world.step();
    acc -= DT;
  }
  checkWins();
  checkDrops();
  updateTrophies(now);

  // motor hum: a louder, higher winch while the cable lowers or lifts, a lower gantry drive while it travels
  if (frameDt > 0) {
    const vert = Math.abs(hub.y - prevHub.y) / frameDt, horiz = Math.hypot(hub.x - prevHub.x, hub.z - prevHub.z) / frameDt;
    if (vert > 0.01) Sound.motor(1.5, hub.y < prevHub.y ? 175 : 205);
    else if (horiz > 0.01) Sound.motor(0.75, 82);
    else Sound.motor(0, 80);
  }
  prevHub.x = hub.x; prevHub.y = hub.y; prevHub.z = hub.z;

  hubMesh.position.copy(hubBody.translation());
  for (const p of prongs) { p.mesh.position.copy(p.body.translation()); p.mesh.quaternion.copy(p.body.rotation()); }
  for (const p of prizes) { p.mesh.position.copy(p.body.translation()); p.mesh.quaternion.copy(p.body.rotation()); }
  carriage.position.set(hub.x, 1.4475, hub.z);
  bridge.position.z = hub.z;
  const cTop = 1.425, cBot = hubMesh.position.y + 0.025;
  cable.scale.y = Math.max(cTop - cBot, 0.001);
  cable.position.set(hub.x, (cTop + cBot) / 2, hub.z);

  laser.visible = laserOn;
  if (laserOn) {
    const start = { x: hubMesh.position.x, y: hubMesh.position.y - 0.046, z: hubMesh.position.z };
    const hit = world.castRay(new RAPIER.Ray(start, { x: 0, y: -1, z: 0 }), 2, true, undefined, LASER_GROUPS);
    const len = hit ? hit.toi : start.y - FLOOR_Y;
    laser.position.set(start.x, start.y, start.z);
    laserCore.scale.y = laserGlow.scale.y = Math.max(len, 0.001);
    laserDot.position.y = -len;
    laserDot.scale.setScalar(0.85 + Math.sin(now * 30) * 0.15);
  }

  // joystick: a damped spring toward the steering direction, so it leans in and wobbles back to centre
  const moving = state === S.IDLE && credits > 0 ? move : { x: 0, z: 0 };
  const TILT = 0.45, K = 260, C = reduceMotion.matches ? 40 : 11;
  stickSpring.vx += ((moving.z * TILT - stickSpring.ax) * K - stickSpring.vx * C) * frameDt;
  stickSpring.vz += ((-moving.x * TILT - stickSpring.az) * K - stickSpring.vz * C) * frameDt;
  stickSpring.ax += stickSpring.vx * frameDt;
  stickSpring.az += stickSpring.vz * frameDt;
  stick.rotation.x = stickSpring.ax;
  stick.rotation.z = stickSpring.az;

  // drop button: quick press and slower release, lit while the claw works, a soft pulse when ready
  const pt = now - pressedAt;
  const depress = pt < 0.08 ? pt / 0.08 : Math.max(0, 1 - (pt - 0.08) / 0.22);
  dropCap.position.y = DROP_CAP_Y - DROP_TRAVEL * depress;
  const busy = state !== S.IDLE;
  const pulse = reduceMotion.matches ? 0 : Math.sin(now * (busy ? 8 : 2.5));
  dropMat.emissiveIntensity = busy ? 0.7 + 0.25 * pulse : credits > 0 ? 0.2 + 0.15 * pulse : 0;
  flapSwing = Math.max(0, flapSwing - 0.02);
  flap.rotation.x = -Math.sin(flapSwing * Math.PI) * 0.6;

  // the fire flickers: light and glow wander together
  const flick = reduceMotion.matches ? 0 : Math.sin(now * 9.1) * 0.35 + Math.sin(now * 23.7) * 0.2 + Math.sin(now * 3.3) * 0.25;
  fireLight.intensity = 3.5 + flick;
  fire.scale.set(1 + flick * 0.05, 1 + flick * 0.12, 1);
  updateCamera(now);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
